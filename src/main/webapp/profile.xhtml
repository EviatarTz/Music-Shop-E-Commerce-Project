<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>הפרופיל שלי - Music Shop</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
    <link rel="stylesheet" href="css/accessibility.css?v=1" />
    <script src="js/accessibility.js?v=1"></script>
</h:head>
<h:body>

    <f:metadata>
        <f:viewAction action="#{profileBean.checkLoginAndLoad}" />
    </f:metadata>

    <h:form id="navForm">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="home" style="text-decoration:none; color:inherit;">
                    <h:graphicImage value="images/logo.png" style="height:45px; vertical-align:middle;" />
                </h:link>
            </f:facet>

            <p:menuitem value="מוצרים" outcome="products" icon="pi pi-list" />
            <p:menuitem value="קצת עלינו" outcome="about" icon="pi pi-info-circle" />
            <p:menuitem value="העגלה שלי" outcome="cart" icon="pi pi-shopping-cart"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ההזמנות שלי" outcome="orders" icon="pi pi-receipt"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="הפרופיל שלי" outcome="profile" icon="pi pi-user"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ניהול" outcome="admin" icon="pi pi-cog"
                        rendered="#{sessionScope.user != null and sessionScope.user.role == 'Administrator'}" />

            <f:facet name="end">
                <h:panelGroup>
                    <p:inputText value="#{searchBean.keyword}" placeholder="...חיפוש מוצרים" style="width:160px; margin-inline-end:6px; text-align:right; " />
                    <p:commandButton icon="pi pi-search" action="#{searchBean.search}" ajax="false" process="@this" style="margin-inline-end:12px;" />
                    <p:button value="התחבר / הירשם" outcome="login"
                              rendered="#{sessionScope.user == null}" />
                    <p:commandButton value="התנתק (#{sessionScope.user.username})" action="#{homeBean.logout}"
                                     rendered="#{sessionScope.user != null}" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
    </h:form>

    <p:growl id="messages" showDetail="true" />

    <div style="max-width:500px; margin:30px auto; padding:0 20px; direction:rtl;">

        <h1 style="text-align:center;">הפרופיל שלי</h1>

        <h2>פרטים אישיים</h2>
        <h:form id="detailsForm">
            <div style="display:flex; flex-direction:column; gap:10px;">
                <p:outputLabel for="username" value="שם משתמש:" />
                <p:inputText id="username" value="#{profileBean.username}" required="true" />

                <p:outputLabel for="email" value="אימייל:" />
                <p:inputText id="email" value="#{profileBean.email}" required="true" />

                <p:commandButton value="שמור שינויים" icon="pi pi-check"
                                 action="#{profileBean.updateDetails}"
                                 update="detailsForm navForm messages" />
            </div>
        </h:form>

        <h2>שינוי סיסמה</h2>
        <h:form id="passwordForm">
            <div style="display:flex; flex-direction:column; gap:10px;">
                <p:outputLabel for="currentPassword" value="סיסמה נוכחית:" />
                <p:password id="currentPassword" value="#{profileBean.currentPassword}" feedback="false" />

                <p:outputLabel for="newPassword" value="סיסמה חדשה:" />
                <p:password id="newPassword" value="#{profileBean.newPassword}" feedback="false" />

                <p:outputLabel for="confirmPassword" value="אימות סיסמה חדשה:" />
                <p:password id="confirmPassword" value="#{profileBean.confirmPassword}" feedback="false" />

                <p:commandButton value="שנה סיסמה" icon="pi pi-lock"
                                 action="#{profileBean.changePassword}"
                                 update="passwordForm messages" />
            </div>
        </h:form>

    </div>

</h:body>
</html>
