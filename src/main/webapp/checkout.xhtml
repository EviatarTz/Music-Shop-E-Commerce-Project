<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>סיכום הזמנה - Music Shop</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
    <link rel="stylesheet" href="css/accessibility.css?v=1" />
    <script src="js/accessibility.js?v=1"></script>
</h:head>
<h:body>

    <f:metadata>
        <f:viewAction action="#{checkoutBean.checkLoginAndLoad}" />
    </f:metadata>

    <h:form id="navForm">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="home" style="text-decoration:none; color:inherit;">
                    <h:graphicImage value="images/logo.png" style="height:45px; vertical-align:middle;" />
                </h:link>
            </f:facet>

            <p:menuitem value="מוצרים" outcome="products" icon="pi pi-list" />
            <p:menuitem value="קצת עלינו" outcome="about" icon="pi pi-info-circle" />
            <p:menuitem value="העגלה שלי" outcome="cart" icon="pi pi-shopping-cart"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ההזמנות שלי" outcome="orders" icon="pi pi-receipt"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="הפרופיל שלי" outcome="profile" icon="pi pi-user"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ניהול" outcome="admin" icon="pi pi-cog"
                        rendered="#{sessionScope.user != null and sessionScope.user.role == 'Administrator'}" />

            <f:facet name="end">
                <h:panelGroup>
                    <p:inputText value="#{searchBean.keyword}" placeholder="...חיפוש מוצרים" style="width:160px; margin-inline-end:6px; text-align:right;" />
                    <p:commandButton icon="pi pi-search" action="#{searchBean.search}" ajax="false" process="@this" style="margin-inline-end:12px;" />
                    <p:button value="התחבר / הירשם" outcome="login"
                              rendered="#{sessionScope.user == null}" />
                    <p:commandButton value="התנתק (#{sessionScope.user.username})" action="#{homeBean.logout}"
                                     rendered="#{sessionScope.user != null}" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
    </h:form>

    <p:growl id="messages" showDetail="true" />

    <div style="max-width:900px; margin:30px auto; padding:0 20px; direction:rtl;">

        <h1 style="text-align:center;">סיכום הזמנה</h1>

        <h:panelGroup rendered="#{empty checkoutBean.items}">
            <div style="text-align:center; padding:60px 0;">
                <p style="font-size:1.2em; color:#666;">אין מוצרים לתשלום — העגלה שלך ריקה.</p>
                <p:button value="למוצרים" outcome="products" icon="pi pi-arrow-left" />
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty checkoutBean.items}">
            <h:form id="checkoutForm">
                <p:dataTable value="#{checkoutBean.items}" var="line" style="width:100%;">

                    <p:column headerText="מוצר" style="width:280px;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:60px; height:60px; border-radius:6px; overflow:hidden; background:#ffffff;
                                        border:1px solid #eee; display:flex; align-items:center; justify-content:center;
                                        padding:4px; box-sizing:border-box; flex-shrink:0;">
                                <img src="images/#{categoryBean.getImageFolder(line.product.categoryId)}/#{line.product.productName}.webp"                                     alt="#{line.product.productName}"
                                     style="width:100%; height:100%; object-fit:contain; display:block;"
                                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                                <i class="pi pi-headphones" style="display:none; font-size:1.5em; color:#8e44ad;"></i>
                            </div>
                            <h:outputText value="#{line.product.productName}" />
                        </div>
                    </p:column>

                    <p:column headerText="מחיר ליחידה">
                        <h:outputText value="₪#{line.product.price}" />
                    </p:column>

                    <p:column headerText="כמות">
                        <h:outputText value="#{line.quantity}" />
                    </p:column>

                    <p:column headerText="סה״כ">
                        <h:outputText value="₪#{line.subtotal}" style="font-weight:bold;" />
                    </p:column>

                </p:dataTable>

                <div style="text-align:left; margin-top:20px; font-size:1.3em; font-weight:bold;">
                    סה״כ לתשלום: ₪#{checkoutBean.total}
                </div>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="בצע הזמנה" icon="pi pi-check" action="#{checkoutBean.submitOrder}" />
                </div>
            </h:form>
        </h:panelGroup>

    </div>

</h:body>
</html>
