<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>מוצרים - Music Shop</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
    <link rel="stylesheet" href="css/accessibility.css?v=1" />
    <script src="js/accessibility.js?v=1"></script>
</h:head>
<h:body>

    <h:form id="navForm">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="home" style="text-decoration:none; color:inherit;">
                    <h:graphicImage value="images/logo.png" style="height:45px; vertical-align:middle;" />
                </h:link>
            </f:facet>

            <p:menuitem value="מוצרים" outcome="products" icon="pi pi-list" />
            <p:menuitem value="קצת עלינו" outcome="about" icon="pi pi-info-circle" />
            <p:menuitem value="העגלה שלי" outcome="cart" icon="pi pi-shopping-cart"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ההזמנות שלי" outcome="orders" icon="pi pi-receipt"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="הפרופיל שלי" outcome="profile" icon="pi pi-user"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ניהול" outcome="admin" icon="pi pi-cog"
                        rendered="#{sessionScope.user != null and sessionScope.user.role == 'Administrator'}" />

            <f:facet name="end">
                <h:panelGroup>
                    <p:inputText value="#{searchBean.keyword}" placeholder="...חיפוש מוצרים" style="width:160px; margin-inline-end:6px; text-align:right;" />
                    <p:commandButton icon="pi pi-search" action="#{searchBean.search}" ajax="false" process="@this" style="margin-inline-end:12px;" />
                    <p:button value="התחבר / הירשם" outcome="login"
                              rendered="#{sessionScope.user == null}" />
                    <p:commandButton value="התנתק (#{sessionScope.user.username})" action="#{homeBean.logout}" icon="pi pi-sign-out"
                                     rendered="#{sessionScope.user != null}" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
    </h:form>

    <div style="text-align:center; direction:rtl; padding:30px 20px 10px;">
        <h1 style="margin:0;">עיון לפי קטגוריה</h1>
        <p style="color:#666;">בחרו קטגוריה כדי לראות את המוצרים שלנו</p>
    </div>

    <div style="max-width:1200px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center; gap:24px; padding:20px 20px 60px; direction:rtl;">
        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="keyboards" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Keyboards.webp" alt="קלידים"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">קלידים</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="guitars" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Guitars.webp" alt="גיטרות"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">גיטרות</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="drums" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Drums.webp" alt="תופים וכלי הקשה"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">תופים וכלי הקשה</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="wind" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Wind.webp" alt="כלי נשיפה"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">כלי נשיפה</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="strings" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Strings.webp" alt="כלי קשת"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">כלי קשת</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="studio" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Studio.webp" alt="ציוד לאולפן"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">ציוד לאולפן</div>
            </div>
        </h:link>

        <h:link outcome="subcategories" style="text-decoration:none; color:inherit;">
            <f:param name="categoryId" value="stage" />
            <div style="width:220px; text-align:center;">
                <div style="width:200px; height:200px; margin:0 auto 10px; border-radius:8px; overflow:hidden; background:#ffffff;
                            display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
                    <img src="images/category-images/Stage.webp" alt="ציוד במה"
                         style="width:100%; height:100%; object-fit:contain; display:block;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                    <i class="pi pi-image" style="display:none; font-size:3em; color:#8e44ad;"></i>
                </div>
                <div style="font-weight:bold;">ציוד במה</div>
            </div>
        </h:link>

    </div>

</h:body>
</html>
