<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>פרטי מוצר - Music Shop</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
    <link rel="stylesheet" href="css/accessibility.css?v=1" />
    <script src="js/accessibility.js?v=1"></script>
    <style>
        .buy-button.ui-button {
            background: #2196f3;
            border-color: #2196f3;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .buy-button.ui-button:hover {
            background: #0d89ec;
            border-color: #0d89ec;
        }
        .buy-button.ui-button:active {
            transform: scale(0.97);
        }
    </style>
</h:head>
<h:body>

    <f:metadata>
        <f:viewParam name="productId" value="#{productDetailsBean.productId}" />
        <f:viewAction action="#{productDetailsBean.loadProduct}" />
    </f:metadata>

    <h:form id="navForm">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="home" style="text-decoration:none; color:inherit;">
                    <h:graphicImage value="images/logo.png" style="height:45px; vertical-align:middle;" />
                </h:link>
            </f:facet>

            <p:menuitem value="מוצרים" outcome="products" icon="pi pi-list" />
            <p:menuitem value="קצת עלינו" outcome="about" icon="pi pi-info-circle" />
            <p:menuitem value="העגלה שלי" outcome="cart" icon="pi pi-shopping-cart"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ההזמנות שלי" outcome="orders" icon="pi pi-receipt"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="הפרופיל שלי" outcome="profile" icon="pi pi-user"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ניהול" outcome="admin" icon="pi pi-cog"
                        rendered="#{sessionScope.user != null and sessionScope.user.role == 'Administrator'}" />

            <f:facet name="end">
                <h:panelGroup>
                    <p:inputText value="#{searchBean.keyword}" placeholder="...חיפוש מוצרים" style="width:160px; margin-inline-end:6px; text-align:right;" />
                    <p:commandButton icon="pi pi-search" action="#{searchBean.search}" ajax="false" process="@this" style="margin-inline-end:12px;" />
                    <p:button value="התחבר / הירשם" outcome="login"
                              rendered="#{sessionScope.user == null}" />
                    <p:commandButton value="התנתק (#{sessionScope.user.username})" action="#{homeBean.logout}"
                                     rendered="#{sessionScope.user != null}" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
    </h:form>

    <p:growl id="messages" showDetail="true" />

    <h:panelGroup rendered="#{productDetailsBean.product == null}">
        <div style="text-align:center; padding:80px 20px; direction:rtl;">
            <h2>המוצר לא נמצא</h2>
            <p:button value="חזרה למוצרים" outcome="products" icon="pi pi-arrow-right" />
        </div>
    </h:panelGroup>

    <div style="max-width:900px; margin:40px auto; padding:0 20px; direction:rtl;
            display:grid; grid-template-columns:320px 1fr; grid-template-rows:auto auto;
            grid-template-areas:'image info' 'image button'; column-gap:40px; row-gap:16px;">

        <div style="grid-area:image; width:320px; height:320px; border-radius:12px; overflow:hidden; background:#ffffff;
                display:flex; align-items:center; justify-content:center; padding:10px; box-sizing:border-box;">
            <h:panelGroup rendered="#{productDetailsBean.product != null}">
                <img src="images/#{categoryBean.getImageFolder(productDetailsBean.product.categoryId)}/#{productDetailsBean.product.productName}.webp"
                     alt="#{productDetailsBean.product.productName}"
                     style="width:100%; height:100%; object-fit:contain; display:block;"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
                <i class="pi pi-headphones" style="display:none; font-size:4em; color:#8e44ad;"></i>
            </h:panelGroup>
        </div>

        <div style="grid-area:info;">
            <h:panelGroup rendered="#{productDetailsBean.product != null}">
                <h1 style="margin-top:0;">#{productDetailsBean.product.productName}</h1>
                <p style="font-size:1.3em; font-weight:bold; color:#000000;">₪#{productDetailsBean.product.price}</p>
                <p style="line-height:1.7; color:#333;">#{productDetailsBean.product.description}</p>
            </h:panelGroup>
        </div>

        <div style="grid-area:button;">
            <h:form id="detailsForm">
                <h:inputHidden value="#{productDetailsBean.productId}" />
                <p:commandButton value="הוסף לעגלה" icon="pi pi-shopping-cart"
                                 styleClass="buy-button"
                                 action="#{homeBean.addToCart(productDetailsBean.productId)}"
                                 update="messages" />
            </h:form>
        </div>
    </div>
</h:body>
</html>
