<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">
<h:head>
    <title>ההזמנות שלי - Music Shop</title>
    <link rel="stylesheet" href="css/style.css?v=6" />
    <link rel="stylesheet" href="css/accessibility.css?v=1" />
    <script src="js/accessibility.js?v=1"></script>
</h:head>
<h:body>

    <f:metadata>
        <f:viewAction action="#{ordersBean.checkLoginAndLoad}" />
    </f:metadata>

    <h:form id="navForm">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="home" style="text-decoration:none; color:inherit;">
                    <h:graphicImage value="images/logo.png" style="height:45px; vertical-align:middle;" />
                </h:link>
            </f:facet>

            <p:menuitem value="מוצרים" outcome="products" icon="pi pi-list" />
            <p:menuitem value="קצת עלינו" outcome="about" icon="pi pi-info-circle" />
            <p:menuitem value="העגלה שלי" outcome="cart" icon="pi pi-shopping-cart"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ההזמנות שלי" outcome="orders" icon="pi pi-receipt"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="הפרופיל שלי" outcome="profile" icon="pi pi-user"
                        rendered="#{sessionScope.user != null}" />
            <p:menuitem value="ניהול" outcome="admin" icon="pi pi-cog"
                        rendered="#{sessionScope.user != null and sessionScope.user.role == 'Administrator'}" />

            <f:facet name="end">
                <h:panelGroup>
                    <p:inputText value="#{searchBean.keyword}" placeholder="...חיפוש מוצרים" style="width:160px; margin-inline-end:6px; text-align:right;" />
                    <p:commandButton icon="pi pi-search" action="#{searchBean.search}" ajax="false" process="@this" style="margin-inline-end:12px;" />
                    <p:button value="התחבר / הירשם" outcome="login"
                              rendered="#{sessionScope.user == null}" />
                    <p:commandButton value="התנתק (#{sessionScope.user.username})" action="#{homeBean.logout}"
                                     rendered="#{sessionScope.user != null}" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
    </h:form>

    <div style="max-width:900px; margin:30px auto; padding:0 20px; direction:rtl;">

        <h1 style="text-align:center;">ההזמנות שלי</h1>

        <h:panelGroup rendered="#{empty ordersBean.orders}">
            <div style="text-align:center; padding:60px 0;">
                <p style="font-size:1.2em; color:#666;">עדיין לא ביצעת אף הזמנה.</p>
                <p:button value="למוצרים" outcome="products" icon="pi pi-arrow-left" />
            </div>
        </h:panelGroup>

        <h:panelGroup rendered="#{not empty ordersBean.orders}">
            <p:dataTable value="#{ordersBean.orders}" var="order" style="width:100%;">

                <p:column headerText="מספר הזמנה">
                    <h:outputText value="#{order.orderId}" />
                </p:column>

                <p:column headerText="תאריך">
                    <h:outputText value="#{order.orderDate}" />
                </p:column>

                <p:column headerText="סה״כ">
                    <h:outputText value="₪#{order.totalPrice}" />
                </p:column>

                <p:column headerText="">
                    <h:link outcome="orderConfirmation" value="לפרטים">
                        <f:param name="orderId" value="#{order.orderId}" />
                    </h:link>
                </p:column>

            </p:dataTable>
        </h:panelGroup>

    </div>

</h:body>
</html>
